<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="388" viewBox="0 0 1000 388" role="img" aria-labelledby="t d">
<title id="t">Vijit Agarwal, software engineer</title>
<desc id="d">An animated request trace. A root span, vijit.ship(), contains ui, api, auth, ai, database and deploy spans, ending in 200 OK.</desc>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.bar{animation:grow .62s cubic-bezier(.22,.8,.24,1) backwards}
.lbl,.pill{animation:fade .5s ease-out backwards}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar,.lbl,.pill{animation:none}}
</style>

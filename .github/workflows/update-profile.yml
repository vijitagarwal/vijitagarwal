name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * 1"        # Mondays, 03:17 UTC
  workflow_dispatch:             # Actions tab -> Run workflow
  push:
    paths:
      - "scripts/update_profile.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/stats.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh stats card"
          git push

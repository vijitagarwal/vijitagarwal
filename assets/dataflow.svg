<title id="t">How a question becomes a chart in DataDarshanam</title>
<desc id="d">Animated request path: Next.js sends a question to FastAPI, which asks Groq to parse intent, Pandas to aggregate, Plotly to build a figure spec, and returns a chart and insight to the browser.</desc>
